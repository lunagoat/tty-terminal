name: Draft source release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate
        run: |
          pacman -Syu --noconfirm python python-fonttools desktop-file-utils git github-cli
          git config --global --add safe.directory "$PWD"
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          make check
          python scripts/prepare_release.py
      - name: Create a draft for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "tty-terminal $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md \
            dist/*/tty-terminal-*.tar.gz dist/*/SHA256SUMS
